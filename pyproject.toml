[project]
name = "hexlet-code"
version = "0.1.0"
description = "Task Manager – Django web application for managing tasks, statuses and labels."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["django", "task manager", "hexlet", "learning"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Django :: 6.0",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dj-database-url>=3.1.0",
    "django>=6.0.1",
    "django-bootstrap5>=26.1",
    "django-filter>=25.2",
    "gunicorn>=24.1.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "rollbar>=1.3.0",
    "ruff>=0.14.14",
    "whitenoise[brotli]>=6.11.0",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
]
